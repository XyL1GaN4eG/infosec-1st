name: Tests and security scans

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn -B clean test
      - name: Run SpotBugs and FindSecBugs (SAST)
        if: ${{ !cancelled() }}
        run: mvn -B compile spotbugs:check
      - name: Upload SpotBugs report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: warn
      - name: Run OWASP Dependency-Check (SCA)
        if: ${{ !cancelled() }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B org.owasp:dependency-check-maven:check -Dnvd.apiKey="$NVD_API_KEY" -Dformat=HTML -DfailBuildOnCVSS=7
      - name: Upload Dependency-Check report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn
