name: Tests and security scans

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn -B clean test
      - name: Run SpotBugs and FindSecBugs (SAST)
        if: ${{ !cancelled() }}
        run: mvn -B compile spotbugs:check
      - name: Upload SpotBugs report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: warn
      - name: Restore Dependency-Check database
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-dependency-check-
      - name: Run OWASP Dependency-Check (SCA)
        id: sca
        if: ${{ !cancelled() }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B org.owasp:dependency-check-maven:check -DnvdApiKeyEnvironmentVariable=NVD_API_KEY -DdataDirectory="${{ runner.temp }}/dependency-check-data" -Dformat=HTML -DfailBuildOnCVSS=7
      - name: Cache Dependency-Check database
        if: ${{ !cancelled() && steps.sca.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ github.run_id }}
      - name: Upload Dependency-Check report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn
